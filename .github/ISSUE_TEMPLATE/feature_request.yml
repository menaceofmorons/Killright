name: Feature request
description: Suggest an improvement or a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Describe how you would like it to work.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Add any other detail, example or screenshot.
    validations:
      required: false
