[package]
name = "killright_history_updater"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "killright_history_updater"
path = "src/main.rs"

[dependencies]
duckdb = { version = "1", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", features = ["blocking", "gzip", "deflate"] }
serde_json = "1"
